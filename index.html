<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SIHA ✨</title>

<style>

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#030006;
    color:white;
}


/* =====================================================
   GLOBAL BACKGROUND
===================================================== */

#space{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:
        radial-gradient(
            circle at 50% 45%,
            rgba(150,30,150,.18),
            transparent 35%
        ),
        radial-gradient(
            circle at 20% 20%,
            rgba(70,20,180,.18),
            transparent 35%
        ),
        #030006;

    z-index:1;
}

.star{
    position:absolute;
    border-radius:50%;
    background:white;
    opacity:.7;

    animation:
        starTwinkle
        2s
        ease-in-out
        infinite
        alternate;
}

@keyframes starTwinkle{

    from{
        opacity:.15;
        transform:scale(.6);
    }

    to{
        opacity:.9;
        transform:scale(1.3);
    }
}


/* =====================================================
   SCREEN SYSTEM
===================================================== */

.screen{
    position:fixed;
    inset:0;

    display:none;
    align-items:center;
    justify-content:center;

    overflow:hidden;
    z-index:10;
}

.screen.active{
    display:flex;
}


/* =====================================================
   MUSIC INDICATOR
===================================================== */

#musicIndicator{

    position:fixed;

    top:18px;
    right:18px;

    z-index:9999;

    padding:9px 14px;

    border-radius:30px;

    background:rgba(15,0,25,.72);

    border:1px solid rgba(255,150,230,.35);

    backdrop-filter:blur(10px);

    font-size:12px;
    letter-spacing:1px;

    opacity:.8;

    pointer-events:none;

}


/* =====================================================
   INTRO
===================================================== */

#introScreen{
    text-align:center;
}

.intro-wrap{
    position:relative;
    z-index:20;

    width:92%;
    max-width:700px;

    animation:
        introAppear
        1.5s
        ease;
}

@keyframes introAppear{

    from{
        opacity:0;
        transform:
            translateY(30px)
            scale(.95);
    }

    to{
        opacity:1;
        transform:
            translateY(0)
            scale(1);
    }
}


.intro-mini{
    font-size:12px;
    letter-spacing:7px;
    opacity:.55;
    margin-bottom:18px;
}


.intro-title{

    font-size:
        clamp(
            60px,
            15vw,
            120px
        );

    font-weight:900;

    letter-spacing:5px;

    background:
        linear-gradient(
            90deg,
            #ff45b7,
            #ffffff,
            #9d65ff,
            #ff45b7
        );

    background-size:300%;

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;

    animation:
        titleMove
        5s
        linear
        infinite;

    text-shadow:
        0 0 40px rgba(255,50,190,.25);
}

@keyframes titleMove{

    from{
        background-position:0%;
    }

    to{
        background-position:300%;
    }
}


.intro-line{

    width:150px;
    height:2px;

    margin:15px auto;

    background:
        linear-gradient(
            90deg,
            transparent,
            #ff7bd4,
            transparent
        );

    box-shadow:
        0 0 15px #ff4fc0;
}


.intro-text{

    font-size:17px;
    opacity:.75;
    margin-top:12px;
}


/* =====================================================
   3D GIFT
===================================================== */

.gift-scene{

    width:180px;
    height:160px;

    margin:45px auto 35px;

    position:relative;

    perspective:800px;

    animation:
        giftFloat
        3s
        ease-in-out
        infinite;
}

@keyframes giftFloat{

    0%,100%{
        transform:
            translateY(0)
            rotateY(-4deg);
    }

    50%{
        transform:
            translateY(-15px)
            rotateY(4deg);
    }
}


.gift-box{

    position:absolute;

    width:145px;
    height:100px;

    left:18px;
    bottom:10px;

    border-radius:12px;

    background:
        linear-gradient(
            135deg,
            #ff278f,
            #9b35ff
        );

    box-shadow:
        0 25px 50px rgba(0,0,0,.45),
        0 0 35px rgba(255,30,180,.25);

    transform:
        rotateX(5deg);
}


.gift-box:before{

    content:"";

    position:absolute;

    left:61px;
    top:0;

    width:23px;
    height:100%;

    background:
        linear-gradient(
            90deg,
            #ffdc65,
            #fff0a0,
            #d99b26
        );
}


.gift-lid{

    position:absolute;

    width:165px;
    height:32px;

    left:8px;
    top:35px;

    border-radius:9px;

    background:
        linear-gradient(
            135deg,
            #ff50ac,
            #a73cff
        );

    box-shadow:
        0 10px 20px rgba(0,0,0,.3);

    z-index:3;
}


.gift-lid:before{

    content:"";

    position:absolute;

    left:71px;
    top:-25px;

    width:23px;
    height:60px;

    background:
        linear-gradient(
            90deg,
            #ffdc65,
            #fff0a0,
            #d99b26
        );
}


.bow{

    position:absolute;

    top:5px;
    left:62px;

    width:58px;
    height:45px;

    z-index:5;
}

.bow:before,
.bow:after{

    content:"";

    position:absolute;

    width:38px;
    height:28px;

    border:
        7px solid #ffd85c;

    border-radius:
        50%
        50%
        10%
        50%;
}

.bow:before{
    transform:rotate(-28deg);
    left:-4px;
}

.bow:after{
    transform:
        rotate(28deg)
        scaleX(-1);

    right:-4px;
}


.open-btn{

    border:none;

    padding:
        17px
        42px;

    border-radius:50px;

    color:white;

    font-size:16px;
    font-weight:bold;

    letter-spacing:1px;

    cursor:pointer;

    background:
        linear-gradient(
            90deg,
            #ff319b,
            #883cff
        );

    box-shadow:
        0 12px 35px rgba(255,30,170,.35),
        0 0 30px rgba(130,50,255,.2);

    transition:.3s;
}

.open-btn:hover{

    transform:
        translateY(-4px)
        scale(1.04);

    box-shadow:
        0 18px 40px rgba(255,30,170,.5);
}


.intro-note{

    margin-top:17px;

    font-size:11px;

    letter-spacing:2px;

    opacity:.45;
}


/* =====================================================
   QUESTIONS
===================================================== */

.question-wrap{

    position:relative;
    z-index:20;

    width:min(92%,700px);

    text-align:center;
}


.question-number{

    font-size:12px;

    letter-spacing:5px;

    opacity:.5;

    margin-bottom:20px;
}


.question-text{

    font-size:
        clamp(
            27px,
            6vw,
            46px
        );

    font-weight:bold;

    line-height:1.25;

    margin-bottom:35px;

    text-shadow:
        0 0 30px rgba(255,70,190,.25);
}


.answers{

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:16px;
}


.answer{

    border:
        1px solid
        rgba(255,255,255,.18);

    background:
        rgba(255,255,255,.055);

    color:white;

    padding:18px;

    border-radius:18px;

    font-size:16px;

    cursor:pointer;

    backdrop-filter:blur(10px);

    transition:.3s;
}


.answer:hover{

    transform:
        translateY(-5px)
        scale(1.02);

    background:
        rgba(255,70,190,.16);

    border-color:
        rgba(255,130,220,.7);

    box-shadow:
        0 10px 30px
        rgba(255,30,170,.15);
}


.answer.correct{

    background:
        rgba(40,220,130,.2);

    border-color:
        #62ffad;

    transform:scale(1.03);
}


.answer.wrong{

    border-color:#ff4b72;

    animation:
        shake
        .35s
        ease;
}

@keyframes shake{

    25%{
        transform:translateX(-8px);
    }

    50%{
        transform:translateX(8px);
    }

    75%{
        transform:translateX(-5px);
    }

}


/* =====================================================
   PUZZLE
===================================================== */

.puzzle-wrap{

    position:relative;
    z-index:20;

    width:94%;

    max-width:570px;

    text-align:center;
}


.puzzle-heading{

    font-size:
        clamp(
            28px,
            6vw,
            45px
        );

    margin-bottom:8px;
}


.puzzle-sub{

    font-size:13px;

    opacity:.6;

    margin-bottom:22px;
}


.puzzle{

    width:
        min(
            90vw,
            480px
        );

    aspect-ratio:1;

    margin:auto;

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:4px;

    padding:5px;

    border-radius:20px;

    background:
        rgba(255,255,255,.08);

    border:
        2px solid
        rgba(255,255,255,.18);

    box-shadow:
        0 20px 70px
        rgba(0,0,0,.55),

        0 0 40px
        rgba(255,40,190,.2);

    touch-action:none;
}


.piece{

    background-image:
        url("photo.jpeg");

    background-size:
        300% 300%;

    background-repeat:no-repeat;

    border-radius:8px;

    cursor:grab;

    user-select:none;

    -webkit-user-select:none;

    touch-action:none;

    transition:
        transform .18s,
        filter .18s,
        box-shadow .18s;
}


.piece:hover{

    filter:brightness(1.15);
}


.piece.dragging{

    cursor:grabbing;

    transform:
        scale(.90)
        translateY(-8px);

    filter:
        brightness(1.25);

    box-shadow:
        0 20px 40px
        rgba(0,0,0,.6),

        0 0 25px
        rgba(255,80,200,.55);

    z-index:50;
}


.puzzle.solved .piece{

    animation:
        puzzleDone
        .5s
        ease;
}

@keyframes puzzleDone{

    50%{
        transform:scale(1.05);
    }

    100%{
        transform:scale(1);
    }
}


/* =====================================================
   SUCCESS
===================================================== */

#success{

    position:fixed;

    inset:0;

    display:none;

    align-items:center;
    justify-content:center;

    background:
        rgba(4,0,10,.78);

    backdrop-filter:blur(10px);

    z-index:100;
}


#success.show{
    display:flex;
}


.success-card{

    width:min(90%,500px);

    padding:45px 30px;

    text-align:center;

    border-radius:30px;

    border:
        1px solid
        rgba(255,255,255,.2);

    background:
        linear-gradient(
            145deg,
            rgba(255,50,180,.16),
            rgba(90,50,255,.16)
        );

    box-shadow:
        0 0 60px
        rgba(255,30,190,.25);

    animation:
        successIn
        .6s
        ease;
}

@keyframes successIn{

    from{
        opacity:0;
        transform:scale(.65);
    }

    to{
        opacity:1;
        transform:scale(1);
    }
}


.success-card h2{

    font-size:38px;

    margin-bottom:12px;
}


.success-card p{

    opacity:.7;
}


/* =====================================================
   CURTAIN THEATRE
===================================================== */

#theatre{

    position:fixed;

    inset:0;

    display:none;

    z-index:200;

    background:#000;

    overflow:hidden;

    perspective:1600px;
}


#theatre.show{
    display:block;
}


/* light behind curtain */

.theatre-light{

    position:absolute;

    width:70vw;
    height:70vw;

    max-width:900px;
    max-height:900px;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    background:
        radial-gradient(
            circle,
            rgba(255,205,110,.45),
            rgba(180,70,255,.12) 35%,
            transparent 70%
        );

    filter:blur(15px);

    opacity:.7;
}


/* dark stage */

.stage{

    position:absolute;

    inset:0;

    background:
        radial-gradient(
            ellipse at center 55%,
            rgba(100,30,110,.2),
            transparent 50%
        ),

        #020002;
}


/* =====================================================
   CURTAIN TOP
===================================================== */

.valance{

    position:absolute;

    top:-20px;

    left:-5%;

    width:110%;

    height:125px;

    z-index:30;

    background:

        repeating-linear-gradient(
            90deg,
            #270008 0px,
            #79001d 25px,
            #3b000d 50px,
            #97002a 75px,
            #290008 100px
        );

    border-bottom:
        7px solid
        #dcae45;

    border-radius:
        0 0 50% 50%;

    box-shadow:
        0 20px 50px
        rgba(0,0,0,.8);
}


.valance:after{

    content:"";

    position:absolute;

    bottom:-14px;

    left:0;

    width:100%;

    height:15px;

    border-radius:50%;

    background:#ffd86a;

    box-shadow:
        0 0 20px
        rgba(255,210,80,.6);
}


/* =====================================================
   MAIN CURTAINS
===================================================== */

.curtain{

    position:absolute;

    top:0;

    width:55%;

    height:100%;

    z-index:20;

    background:

        linear-gradient(
            90deg,
            rgba(0,0,0,.7),
            transparent 15%,
            rgba(255,60,100,.08) 50%,
            transparent 85%,
            rgba(0,0,0,.75)
        ),

        repeating-linear-gradient(
            90deg,
            #270008 0px,
            #71001b 22px,
            #35000c 43px,
            #a3002d 65px,
            #39000d 87px
        );

    box-shadow:
        inset 0 0 80px
        rgba(0,0,0,.7),

        0 0 50px
        rgba(0,0,0,.9);

    transition:
        transform
        3s
        cubic-bezier(.72,0,.15,1),

        filter 3s,

        opacity 3s;
}


/* extra velvet folds */

.curtain:before{

    content:"";

    position:absolute;

    inset:0;

    background:

        repeating-linear-gradient(
            90deg,
            transparent 0px,
            rgba(255,100,140,.1) 10px,
            transparent 23px,
            rgba(0,0,0,.2) 40px
        );

    pointer-events:none;
}


.curtain.left{

    left:0;

    transform-origin:
        left center;
}


.curtain.right{

    right:0;

    transform-origin:
        right center;
}


/* =====================================================
   DIFFERENT CURTAIN OPEN
===================================================== */

/*
   First the curtains move toward the centre,
   then swing outward in 3D.
*/

#theatre.open .curtain.left{

    transform:
        translateX(-112%)
        rotateY(28deg)
        rotateZ(-1deg)
        scaleX(.72);

    filter:
        brightness(.65);
}


#theatre.open .curtain.right{

    transform:
        translateX(112%)
        rotateY(-28deg)
        rotateZ(1deg)
        scaleX(.72);

    filter:
        brightness(.65);
}


/* =====================================================
   GOLD SIDE ROPES
===================================================== */

.rope{

    position:absolute;

    top:48%;

    width:100px;

    height:150px;

    z-index:35;

    border:
        5px solid
        #e6b74f;

    border-left:none;

    border-radius:
        0 100px 100px 0;

    box-shadow:
        0 0 20px
        rgba(255,210,80,.6);

    transition:
        2.5s ease;
}


.rope.left{
    left:49%;
}


.rope.right{

    right:49%;

    transform:
        scaleX(-1);
}


#theatre.open .rope.left{

    left:4%;

    opacity:0;
}


#theatre.open .rope.right{

    right:4%;

    opacity:0;
}


/* =====================================================
   GOLD TIE
===================================================== */

.tie{

    position:absolute;

    top:60%;

    width:75px;
    height:75px;

    z-index:36;

    border:
        5px solid
        #f0c65d;

    border-radius:50%;

    box-shadow:
        0 0 25px
        rgba(255,210,80,.7);

    transition:
        2.5s ease;
}


.tie.left{
    left:50%;
    transform:translateX(-50%);
}


.tie.right{
    right:50%;
    transform:translateX(50%);
}


#theatre.open .tie.left{

    left:5%;

    opacity:0;

    transform:
        translateX(-50%)
        scale(.5);
}


#theatre.open .tie.right{

    right:5%;

    opacity:0;

    transform:
        translateX(50%)
        scale(.5);
}


/* =====================================================
   CURTAIN MESSAGE
===================================================== */

.theatre-message{

    position:absolute;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%)
        scale(.7);

    text-align:center;

    z-index:10;

    opacity:0;

    transition:
        1.5s
        ease
        .7s;
}


#theatre.open .theatre-message{

    opacity:1;

    transform:
        translate(-50%,-50%)
        scale(1);
}


.theatre-message h1{

    font-size:
        clamp(
            32px,
            7vw,
            72px
        );

    text-shadow:
        0 0 20px white,
        0 0 50px #ff65d0;
}


.theatre-message p{

    margin-top:12px;

    letter-spacing:5px;

    font-size:12px;

    opacity:.65;
}


/* =====================================================
   BLACK PAUSE
===================================================== */

#blackPause{

    position:fixed;

    inset:0;

    background:#000;

    z-index:500;

    display:none;

    opacity:1;
}


#blackPause.show{
    display:block;
}


/* =====================================================
   FINAL SCREEN
===================================================== */

#finalScreen{

    background:#000;

    z-index:600;
}


.final-bg{

    position:absolute;

    inset:0;

    background:
        radial-gradient(
            circle at center,
            rgba(130,30,110,.14),
            transparent 50%
        ),

        #000;
}


.final-content{

    position:relative;

    z-index:10;

    width:100%;
    height:100%;

    display:flex;

    align-items:center;
    justify-content:center;

    padding:
        25px
        10px;
}


/* gold frame */

.final-frame{

    max-width:95vw;
    max-height:93vh;

    padding:6px;

    border-radius:15px;

    background:

        linear-gradient(
            135deg,
            #9a6820,
            #ffe48a,
            #c18b32,
            #fff0a0,
            #8c5c1c
        );

    box-shadow:

        0 0 25px
        rgba(255,210,90,.45),

        0 25px 80px
        rgba(0,0,0,.8);

    animation:
        finalReveal
        2s
        cubic-bezier(.2,.8,.2,1);
}


.final-image{

    display:block;

    max-width:92vw;

    max-height:88vh;

    width:auto;

    height:auto;

    object-fit:contain;

    border-radius:9px;
}


@keyframes finalReveal{

    0%{

        opacity:0;

        transform:
            scale(.55)
            translateY(40px);

        filter:
            brightness(2)
            blur(10px);
    }

    55%{

        opacity:1;

        transform:
            scale(1.04);

        filter:
            brightness(1.15)
            blur(0);
    }

    100%{

        opacity:1;

        transform:
            scale(1);

        filter:
            brightness(1)
            blur(0);
    }
}


/* =====================================================
   FLASH
===================================================== */

#flash{

    position:fixed;

    inset:0;

    background:white;

    z-index:800;

    pointer-events:none;

    opacity:0;
}


#flash.show{

    animation:
        flashEffect
        .7s
        ease;
}


@keyframes flashEffect{

    0%{
        opacity:0;
    }

    15%{
        opacity:.9;
    }

    100%{
        opacity:0;
    }
}


/* =====================================================
   CONFETTI
===================================================== */

.confetti{

    position:fixed;

    top:-20px;

    width:7px;
    height:13px;

    z-index:650;

    pointer-events:none;

    animation:
        confettiFall
        4s
        linear
        forwards;
}


@keyframes confettiFall{

    to{

        transform:
            translateY(110vh)
            rotate(720deg);

        opacity:0;
    }
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:600px){

    #musicIndicator{

        top:10px;
        right:10px;

        font-size:10px;
    }


    .answers{

        gap:10px;
    }


    .answer{

        padding:15px 8px;

        font-size:14px;
    }


    .gift-scene{

        transform:scale(.85);
    }


    .puzzle{

        width:91vw;
    }


    .valance{

        height:95px;
    }


    .final-content{

        padding:
            50px
            5px
            10px;
    }

}

</style>
</head>


<body>


<!-- =====================================================
     SPACE BACKGROUND
===================================================== -->

<div id="space"></div>


<!-- =====================================================
     MUSIC STATUS
===================================================== -->

<div id="musicIndicator">
    🔊 MUSIC PLAYING
</div>


<!-- =====================================================
     INTRO
===================================================== -->

<section
    id="introScreen"
    class="screen active"
>

    <div class="intro-wrap">

        <div class="intro-mini">
            A LITTLE SOMETHING
        </div>

        <div class="intro-title">
            SIHA
        </div>

        <div class="intro-line"></div>

        <div class="intro-text">
            Some surprises are worth solving... ✨
        </div>


        <div class="gift-scene">

            <div class="bow"></div>

            <div class="gift-lid"></div>

            <div class="gift-box"></div>

        </div>


        <button
            id="openBtn"
            class="open-btn"
        >
            ENTER THE SURPRISE ✨
        </button>

<!-- FLASH -->

<div id="flash"></div>


<script>

/* =====================================================
   STAR BACKGROUND
===================================================== */

const space =
    document.getElementById("space");


for(let i=0;i<90;i++){

    const star =
        document.createElement("div");

    star.className="star";

    const size =
        Math.random()*3+1;

    star.style.width =
        size+"px";

    star.style.height =
        size+"px";

    star.style.left =
        Math.random()*100+"%";

    star.style.top =
        Math.random()*100+"%";

    star.style.animationDelay =
        Math.random()*3+"s";

    space.appendChild(star);
}


/* =====================================================
   AUDIO ENGINE
===================================================== */

let audioContext = null;
let masterGain = null;

let musicStarted = false;

let musicTimer = null;

let melodyIndex = 0;


/* nice simple melody */

const melody = [

    [261.63,330],
    [329.63,330],
    [392.00,330],
    [523.25,500],

    [392.00,330],
    [329.63,330],
    [293.66,330],
    [392.00,500],

    [261.63,330],
    [329.63,330],
    [440.00,330],
    [523.25,500],

    [493.88,330],
    [440.00,330],
    [392.00,330],
    [329.63,550]

];


function createAudio(){

    if(audioContext){
        return true;
    }


    const AudioCtx =
        window.AudioContext ||
        window.webkitAudioContext;


    if(!AudioCtx){

        console.log(
            "Web Audio is not supported."
        );

        return false;
    }


    audioContext =
        new AudioCtx();


    masterGain =
        audioContext.createGain();


    masterGain.gain.value =
        0.17;


    masterGain.connect(
        audioContext.destination
    );


    return true;
}


/* =====================================================
   SOUND EFFECT
===================================================== */

function sound(
    frequency,
    duration,
    type="sine",
    volume=.2
){

    if(
        !audioContext ||
        !musicStarted
    ){
        return;
    }


    const osc =
        audioContext.createOscillator();


    const gain =
        audioContext.createGain();


    osc.type=type;


    osc.frequency.setValueAtTime(
        frequency,
        audioContext.currentTime
    );


    gain.gain.setValueAtTime(
        .0001,
        audioContext.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
        volume,
        audioContext.currentTime+.025
    );


    gain.gain.exponentialRampToValueAtTime(
        .0001,
        audioContext.currentTime+duration
    );


    osc.connect(gain);

    gain.connect(masterGain);


    osc.start();


    osc.stop(
        audioContext.currentTime+
        duration+
        .03
    );
}


/* =====================================================
   START MUSIC
===================================================== */

async function startMusic(){

    if(!createAudio()){
        return;
    }


    try{

        if(
            audioContext.state ===
            "suspended"
        ){

            await audioContext.resume();

        }


        musicStarted=true;


        document
            .getElementById("musicIndicator")
            .textContent=
            "🔊 MUSIC PLAYING";


        melodyIndex=0;


        /* startup chime */

        sound(
            523.25,
            .18,
            "sine",
            .22
        );


        setTimeout(()=>{

            sound(
                659.25,
                .18,
                "sine",
                .20
            );

        },130);


        setTimeout(()=>{

            sound(
                783.99,
                .3,
                "sine",
                .18
            );

        },260);


        playMelody();

    }
    catch(error){

        console.log(error);

    }

}


/* =====================================================
   MELODY
===================================================== */

function playMelody(){

    if(!musicStarted){
        return;
    }


    const note =
        melody[melodyIndex];


    sound(
        note[0],
        note[1]/1000,
        "triangle",
        .12
    );


    if(
        melodyIndex%4===3
    ){

        sound(
            note[0]*2,
            .4,
            "sine",
            .035
        );

    }


    melodyIndex++;


    if(
        melodyIndex>=melody.length
    ){

        melodyIndex=0;

    }


    musicTimer =
        setTimeout(
            playMelody,
            note[1]
        );

}


/* =====================================================
   INTRO START
===================================================== */

const openBtn =
    document.getElementById("openBtn");


openBtn.addEventListener(
    "click",
    async function(){

        /*
          This click is a real user action.
          Browser audio permission is therefore
          obtained here.
        */

        await startMusic();


        sound(
            392,
            .2,
            "sine",
            .18
        );


        showScreen(
            document.getElementById(
                "questionScreen"
            )
        );


        currentQuestion=0;

        loadQuestion();

    }
);


/* =====================================================
   SCREEN CHANGE
===================================================== */

function showScreen(screen){

    document
        .querySelectorAll(".screen")
        .forEach(
            s=>
                s.classList.remove(
                    "active"
                )
        );


    screen.classList.add("active");

}


/* =====================================================
   QUESTIONS
===================================================== */

const questions = [

    {

        question:
            "Naa unna epdi kupduven?",

        options:[
            "Alagii",
            "Alukuuuu",
            "Eruma",
            "Loosuu"
        ],

        correct:1

    },

    {

        question:
            "Enaku pidicha dress color enna?",

        options:[
            "Blue",
            "Black",
            "Orange",
            "Yellow"
        ],

        correct:3

    },

    {

        question:
            "Secret code sollu",

        options:[
            "16",
            "17",
            "18",
            "19"
        ],

        correct:2

    }

];


let currentQuestion=0;


const questionText =
    document.getElementById(
        "questionText"
    );


const questionNumber =
    document.getElementById(
        "questionNumber"
    );


const answers =
    document.getElementById(
        "answers"
    );


function loadQuestion(){

    const q =
        questions[currentQuestion];


    questionNumber.textContent =
        "QUESTION " +
        (currentQuestion+1) +
        " / 3";


    questionText.textContent =
        q.question;


    answers.innerHTML="";


    q.options.forEach(
        (text,index)=>{

            const button =
                document.createElement(
                    "button"
                );


            button.className="answer";


            button.textContent=text;


            button.addEventListener(
                "click",
                ()=>{

                    answerQuestion(
                        index,
                        button
                    );

                }
            );


            answers.appendChild(button);

        }
    );

}


/* =====================================================
   ANSWER
===================================================== */

function answerQuestion(
    selected,
    button
){

    const q =
        questions[currentQuestion];


    if(
        selected ===
        q.correct
    ){

        button.classList.add(
            "correct"
        );


        sound(
            659.25,
            .15,
            "sine",
            .18
        );


        setTimeout(()=>{

            sound(
                783.99,
                .25,
                "sine",
                .16
            );

        },120);


        setTimeout(()=>{

            currentQuestion++;


            if(
                currentQuestion <
                questions.length
            ){

                loadQuestion();

            }
            else{

                showPuzzle();

            }

        },550);

    }
    else{

        button.classList.add(
            "wrong"
        );


        sound(
            170,
            .22,
            "sawtooth",
            .07
        );


        setTimeout(()=>{

            button.classList.remove(
                "wrong"
            );

        },400);

    }

}


/* =====================================================
   PUZZLE
===================================================== */

const puzzle =
    document.getElementById(
        "puzzle"
    );


let draggedPiece=null;

let pointerID=null;


function showPuzzle(){

    showScreen(
        document.getElementById(
            "puzzleScreen"
        )
    );


    createPuzzle();

}


/* =====================================================
   CREATE PUZZLE
===================================================== */

function createPuzzle(){

    puzzle.innerHTML="";

    puzzle.classList.remove(
        "solved"
    );

    puzzle.style.pointerEvents=
        "auto";


    let pieces=[];


    for(let i=0;i<9;i++){

        pieces.push(i);

    }


    /* shuffle */

    for(
        let i=pieces.length-1;
        i>0;
        i--
    ){

        const j =
            Math.floor(
                Math.random()*(i+1)
            );


        [
            pieces[i],
            pieces[j]
        ] =
        [
            pieces[j],
            pieces[i]
        ];

    }


    /* avoid already solved */

    if(
        pieces.every(
            (v,i)=>v===i
        )
    ){

        [
            pieces[0],
            pieces[1]
        ]=
        [
            pieces[1],
            pieces[0]
        ];

    }


    pieces.forEach(
        number=>{

            const piece =
                document.createElement(
                    "div"
                );


            piece.className=
                "piece";


            piece.dataset.piece=
                number;


            setPieceImage(piece);


            piece.addEventListener(
                "pointerdown",
                dragStart
            );


            piece.addEventListener(
                "pointermove",
                dragMove
            );


            piece.addEventListener(
                "pointerup",
                dragEnd
            );


            piece.addEventListener(
                "pointercancel",
                dragCancel
            );


            puzzle.appendChild(
                piece
            );

        }
    );

}


/* =====================================================
   PIECE IMAGE
===================================================== */

function setPieceImage(piece){

    const number =
        Number(
            piece.dataset.piece
        );


    const row =
        Math.floor(number/3);


    const col =
        number%3;


    piece.style.backgroundPosition =
        (col*50) +
        "% " +
        (row*50) +
        "%";

}


/* =====================================================
   DRAG START
===================================================== */

function dragStart(event){

    if(
        event.button !== undefined &&
        event.button !== 0
    ){
        return;
    }


    draggedPiece=this;

    pointerID=
        event.pointerId;


    this.classList.add(
        "dragging"
    );


    try{

        this.setPointerCapture(
            event.pointerId
        );

    }
    catch(e){}


    event.preventDefault();

}


/* =====================================================
   DRAG MOVE
===================================================== */

function dragMove(event){

    if(
        !draggedPiece ||
        event.pointerId !== pointerID
    ){
        return;
    }


    event.preventDefault();


    const rect =
        draggedPiece.getBoundingClientRect();


    const centerX =
        rect.left+
        rect.width/2;


    const centerY =
        rect.top+
        rect.height/2;


    const dx =
        event.clientX-centerX;


    const dy =
        event.clientY-centerY;


    draggedPiece.style.transform =
        "translate("+
        (dx*.08)+
        "px,"+
        (dy*.08)+
        "px) scale(.92)";

}


/* =====================================================
   DRAG END
===================================================== */

function dragEnd(event){

    if(
        !draggedPiece ||
        event.pointerId !== pointerID
    ){
        return;
    }


    event.preventDefault();


    const source =
        draggedPiece;


    source.classList.remove(
        "dragging"
    );


    source.style.transform="";


    let target =
        document.elementFromPoint(
            event.clientX,
            event.clientY
        );


    if(target){

        target =
            target.closest(
                ".piece"
            );

    }


    if(
        target &&
        target !== source &&
        target.parentElement === puzzle
    ){

        swapPieces(
            source,
            target
        );


        sound(
            440,
            .1,
            "sine",
            .1
        );


        checkPuzzle();

    }


    draggedPiece=null;

    pointerID=null;

}


/* =====================================================
   DRAG CANCEL
===================================================== */

function dragCancel(){

    if(!draggedPiece){
        return;
    }


    draggedPiece.classList.remove(
        "dragging"
    );


    draggedPiece.style.transform="";


    draggedPiece=null;

    pointerID=null;

}


/* =====================================================
   SWAP
===================================================== */

function swapPieces(a,b){

    const temp =
        a.dataset.piece;


    a.dataset.piece =
        b.dataset.piece;


    b.dataset.piece =
        temp;


    setPieceImage(a);

    setPieceImage(b);

}


/* =====================================================
   CHECK PUZZLE
===================================================== */

function checkPuzzle(){

    const pieces =
        [
            ...puzzle.children
        ];


    const solved =
        pieces.every(
            (piece,index)=>
                Number(
                    piece.dataset.piece
                )===index
        );


    if(!solved){
        return;
    }


    puzzle.classList.add(
        "solved"
    );


    puzzle.style.pointerEvents=
        "none";


    sound(
        523.25,
        .18,
        "sine",
        .2
    );


    setTimeout(()=>{

        sound(
            659.25,
            .18,
            "sine",
            .2
        );

    },140);


    setTimeout(()=>{

        sound(
            783.99,
            .25,
            "sine",
            .2
        );

    },280);


    setTimeout(
        showSuccess,
        650
    );

}


/* =====================================================
   SUCCESS
===================================================== */

const success =
    document.getElementById(
        "success"
    );


function showSuccess(){

    success.classList.add(
        "show"
    );


    setTimeout(()=>{

        success.classList.remove(
            "show"
        );


        startTheatre();

    },1800);

}


/* =====================================================
   CURTAIN SOUND
===================================================== */

function curtainSound(){

    if(
        !audioContext ||
        !musicStarted
    ){
        return;
    }


    const osc =
        audioContext.createOscillator();


    const gain =
        audioContext.createGain();


    osc.type="sawtooth";


    osc.frequency.setValueAtTime(
        90,
        audioContext.currentTime
    );


    osc.frequency.exponentialRampToValueAtTime(
        850,
        audioContext.currentTime+1.8
    );


    gain.gain.setValueAtTime(
        .001,
        audioContext.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
        .08,
        audioContext.currentTime+.2
    );


    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioContext.currentTime+1.9
    );


    osc.connect(gain);

    gain.connect(masterGain);


    osc.start();


    osc.stop(
        audioContext.currentTime+2
    );

}


/* =====================================================
   THEATRE
===================================================== */

const theatre =
    document.getElementById(
        "theatre"
    );


const blackPause =
    document.getElementById(
        "blackPause"
    );


const flash =
    document.getElementById(
        "flash"
    );


function startTheatre(){

    theatre.classList.add(
        "show"
    );


    /* short cinematic pause */

    setTimeout(()=>{

        curtainSound();

        theatre.classList.add(
            "open"
        );

    },500);


    /*
      Curtain is now fully open.
      Then everything goes completely black.
    */

    setTimeout(()=>{

        blackPause.classList.add(
            "show"
        );

    },3200);


    /*
      Black pause stays for a moment.
      Then final image appears.
    */

    setTimeout(()=>{

        theatre.classList.remove(
            "show"
        );


        showScreen(
            document.getElementById(
                "finalScreen"
            )
        );


        setTimeout(()=>{

            blackPause.classList.remove(
                "show"
            );

        },350);


        flash.classList.remove(
            "show"
        );


        void flash.offsetWidth;


        flash.classList.add(
            "show"
        );


        finalSound();

        createConfetti();

    },4000);

}


/* =====================================================
   FINAL SOUND
===================================================== */

function finalSound(){

    if(!musicStarted){
        return;
    }


    const notes=[
        523.25,
        659.25,
        783.99,
        1046.50
    ];


    notes.forEach(
        (note,index)=>{

            setTimeout(()=>{

                sound(
                    note,
                    .5,
                    "sine",
                    .18
                );

            },index*180);

        }
    );

}


/* =====================================================
   CONFETTI
===================================================== */

function createConfetti(){

    const colors=[
        "#ff4fa3",
        "#ffd45c",
        "#8f6cff",
        "#65e8ff",
        "#7dff9c"
    ];


    for(
        let i=0;
        i<65;
        i++
    ){

        const piece =
            document.createElement(
                "div"
            );


        piece.className=
            "confetti";


        piece.style.left=
            Math.random()*100+
            "%";


        piece.style.background=
            colors[
                Math.floor(
                    Math.random()*
                    colors.length
                )
            ];


        piece.style.animationDelay=
            Math.random()*1.2+
            "s";


        piece.style.animationDuration=
            2.8+
            Math.random()*2+
            "s";


        document.body.appendChild(
            piece
        );


        setTimeout(()=>{

            piece.remove();

        },5000);

    }

}


/* =====================================================
   INITIAL STATE
===================================================== */

document
    .getElementById(
        "musicIndicator"
    )
    .textContent=
    "🔊 SOUND READY";


</script>
