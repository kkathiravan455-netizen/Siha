<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SIHA ❤️</title>

<style>

/* =========================================================
   GLOBAL
========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Georgia,"Times New Roman",serif;
}

body{
    color:white;
}

.screen{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

.hidden{
    display:none !important;
}


/* =========================================================
   CINEMATIC BARS
========================================================= */

.bar{
    position:fixed;
    left:0;
    width:100%;
    height:35px;
    background:#000;
    z-index:1000;
    pointer-events:none;
}

.bar.top{
    top:0;
}

.bar.bottom{
    bottom:0;
}


/* =========================================================
   STARS
========================================================= */

#stars{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:2;
}

.star{
    position:absolute;
    width:2px;
    height:2px;
    background:white;
    border-radius:50%;
    opacity:.5;
    animation:twinkle 3s infinite ease-in-out;
}

@keyframes twinkle{

    0%,100%{
        opacity:.15;
        transform:scale(.7);
    }

    50%{
        opacity:1;
        transform:scale(1.5);
    }

}


/* =========================================================
   INTRO
========================================================= */

#intro{
    z-index:10;

    background:
        radial-gradient(
            circle at center,
            rgba(90,25,120,.35),
            rgba(0,0,0,.95) 65%
        ),
        #020105;
}

.introContent{
    position:relative;
    z-index:10;
    text-align:center;
    animation:introAppear 2s ease forwards;
}

@keyframes introAppear{

    from{
        opacity:0;
        transform:scale(.8);
    }

    to{
        opacity:1;
        transform:scale(1);
    }

}

.smallText{
    font-size:13px;
    letter-spacing:5px;
    color:#bba7c9;
    margin-bottom:18px;
}

.siha{
    font-size:clamp(60px,12vw,130px);
    font-weight:bold;
    letter-spacing:15px;
    color:#fff;

    text-shadow:
        0 0 10px #b36cff,
        0 0 30px #7a25b8,
        0 0 70px #4b0877;
}

.subText{
    margin-top:12px;
    font-size:12px;
    letter-spacing:4px;
    color:#9e8da8;
}


/* =========================================================
   GIFT
========================================================= */

.giftArea{
    position:relative;
    width:130px;
    height:130px;
    margin:45px auto 35px;
}

.giftBox{
    position:absolute;
    left:15px;
    bottom:0;
    width:100px;
    height:75px;

    background:
        linear-gradient(
            90deg,
            #32103e,
            #711c83,
            #32103e
        );

    border:1px solid #c277dc;

    box-shadow:
        0 0 20px rgba(190,80,255,.5);
}

.giftLid{
    position:absolute;
    left:8px;
    top:40px;
    width:114px;
    height:25px;

    background:
        linear-gradient(
            90deg,
            #461050,
            #a52dbd,
            #461050
        );

    border:1px solid #dc91ed;
}

.giftRibbon{
    position:absolute;
    left:59px;
    top:40px;
    width:14px;
    height:75px;
    background:#e2b84b;

    box-shadow:
        0 0 10px rgba(255,215,80,.6);
}

.giftArea::before,
.giftArea::after{
    content:"";
    position:absolute;
    top:20px;
    width:40px;
    height:28px;

    border:5px solid #e2b84b;
    border-radius:50%;
}

.giftArea::before{
    left:42px;
    transform:rotate(30deg);
}

.giftArea::after{
    right:42px;
    transform:rotate(-30deg);
}


/* =========================================================
   ENTER BUTTON
========================================================= */

.enterBtn{
    padding:16px 34px;

    border:1px solid #d5ad4c;
    border-radius:30px;

    background:
        linear-gradient(
            135deg,
            rgba(212,175,55,.12),
            rgba(125,40,170,.18)
        );

    color:#f6df9b;

    font-size:12px;
    letter-spacing:3px;

    cursor:pointer;

    transition:.4s;

    box-shadow:
        0 0 15px rgba(212,175,55,.2);
}

.enterBtn:hover{
    transform:scale(1.08);

    box-shadow:
        0 0 30px rgba(212,175,55,.6);
}


/* =========================================================
   QUESTIONS
========================================================= */

#questions{
    z-index:100;

    background:
        radial-gradient(
            circle,
            rgba(79,22,102,.45),
            #020103 70%
        );
}

.questionBox{
    width:min(700px,90vw);

    padding:40px 30px;

    text-align:center;

    border:1px solid rgba(212,175,55,.5);

    background:
        linear-gradient(
            145deg,
            rgba(35,12,48,.88),
            rgba(5,2,10,.95)
        );

    box-shadow:
        0 0 40px rgba(135,40,180,.25);

    border-radius:18px;
}

.progress{
    color:#d4af37;
    font-size:12px;
    letter-spacing:4px;
    margin-bottom:30px;
}

.question{
    font-size:clamp(20px,4vw,32px);
    line-height:1.4;
    margin-bottom:30px;
}

.options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.option{
    padding:17px;

    border:1px solid rgba(212,175,55,.35);
    border-radius:10px;

    background:rgba(255,255,255,.03);

    color:#eee;

    cursor:pointer;

    transition:.35s;
}

.option:hover{
    transform:translateY(-4px);

    border-color:#d4af37;

    box-shadow:
        0 0 20px rgba(212,175,55,.3);
}

.option.correct{
    background:rgba(30,160,80,.25);
    border-color:#61ff9b;
}

.option.wrong{
    background:rgba(180,20,50,.25);
    border-color:#ff6078;
}


/* =========================================================
   PUZZLE
========================================================= */

#puzzleScreen{
    z-index:120;

    background:
        radial-gradient(
            circle,
            rgba(66,20,80,.4),
            #010101 70%
        );
}

.puzzleBox{
    text-align:center;
}

.puzzleTitle{
    font-size:clamp(25px,5vw,40px);
    letter-spacing:5px;
    color:#e5c76d;

    text-shadow:
        0 0 20px #d4af37;
}

.puzzleHint{
    margin-top:10px;
    margin-bottom:25px;

    font-size:11px;
    letter-spacing:3px;
    color:#aaa;
}

.puzzle{
    width:min(390px,82vw);
    height:min(390px,82vw);

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    grid-template-rows:
        repeat(3,1fr);

    gap:3px;

    margin:auto;

    border:3px solid #d4af37;
    padding:3px;

    background:#000;

    box-shadow:
        0 0 25px rgba(212,175,55,.35),
        0 0 80px rgba(100,30,130,.3);
}

.piece{
    width:100%;
    height:100%;

    background-image:url("photo.jpeg");

    background-size:300% 300%;
    background-repeat:no-repeat;

    cursor:grab;

    border:1px solid rgba(255,255,255,.1);

    transition:.2s;
}

.piece:hover{
    filter:brightness(1.25);

    box-shadow:
        0 0 10px rgba(255,255,255,.2);
}

.p0{background-position:0% 0%;}
.p1{background-position:50% 0%;}
.p2{background-position:100% 0%;}
.p3{background-position:0% 50%;}
.p4{background-position:50% 50%;}
.p5{background-position:100% 50%;}
.p6{background-position:0% 100%;}
.p7{background-position:50% 100%;}
.p8{background-position:100% 100%;}


/* =========================================================
   SOLVED
========================================================= */

#solved{
    position:fixed;
    inset:0;

    z-index:200;

    background:#000;

    display:none;

    align-items:center;
    justify-content:center;

    text-align:center;
}

#solved.show{
    display:flex;
    animation:solvedFade 4s ease forwards;
}

.solvedText h1{
    font-size:clamp(45px,10vw,90px);

    color:#e3bd57;

    letter-spacing:8px;

    text-shadow:
        0 0 15px #d4af37,
        0 0 50px #8c5b00;
}

.solvedText p{
    margin-top:15px;

    letter-spacing:5px;

    color:#aaa;
}

@keyframes solvedFade{

    0%{
        opacity:0;
    }

    15%{
        opacity:1;
    }

    80%{
        opacity:1;
    }

    100%{
        opacity:0;
    }

}


/* =========================================================
   DARK LUXURY CURTAIN
========================================================= */

#curtainScene{
    z-index:250;

    background:#000;

    perspective:1500px;
}

.stageLight{
    position:absolute;

    width:45vw;
    height:45vw;

    max-width:650px;
    max-height:650px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,221,130,.65),
            rgba(255,184,55,.12) 35%,
            transparent 70%
        );

    opacity:0;

    transform:scale(.3);

    transition:
        opacity 2s,
        transform 3s;
}

#curtainScene.ready .stageLight{
    opacity:1;
    transform:scale(1);
}

.curtain{
    position:absolute;

    top:-5%;
    bottom:-5%;

    width:55%;

    z-index:5;

    transition:
        transform 2.8s cubic-bezier(.77,0,.18,1),
        filter 2.8s,
        opacity 2.8s;

    box-shadow:
        inset 0 0 60px #000,
        0 0 40px #000;
}

.curtain.left{
    left:-3%;

    transform-origin:left center;

    background:
        repeating-linear-gradient(
            90deg,
            #08040d 0px,
            #21112e 25px,
            #08040d 50px,
            #392044 78px,
            #100717 105px
        );
}

.curtain.right{
    right:-3%;

    transform-origin:right center;

    background:
        repeating-linear-gradient(
            90deg,
            #100717 0px,
            #392044 28px,
            #08040d 55px,
            #21112e 80px,
            #08040d 110px
        );
}

#curtainScene.open .curtain.left{

    transform:
        translateX(-105%)
        rotateY(35deg)
        rotateZ(-2deg)
        scaleX(.65);

    filter:brightness(.45);
}

#curtainScene.open .curtain.right{

    transform:
        translateX(105%)
        rotateY(-35deg)
        rotateZ(2deg)
        scaleX(.65);

    filter:brightness(.45);
}

.topFrame{
    position:absolute;

    top:5%;
    left:7%;
    right:7%;

    height:8px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #d4af37,
            #fff1a8,
            #d4af37,
            transparent
        );

    box-shadow:
        0 0 15px #d4af37;

    z-index:20;

    transform:translateY(-100px);

    transition:transform 2s;
}

#curtainScene.ready .topFrame{
    transform:translateY(0);
}

.ornament{
    position:absolute;

    top:7%;
    left:50%;

    transform:
        translateX(-50%)
        scale(0);

    width:45px;
    height:45px;

    z-index:25;

    transition:
        transform 2s 1s;
}

#curtainScene.ready .ornament{
    transform:
        translateX(-50%)
        scale(1);
}

.ornament::before{
    content:"♥";

    color:#e2b84b;

    font-size:40px;

    text-shadow:
        0 0 10px #d4af37,
        0 0 30px #d4af37;
}


/* =========================================================
   FINAL SCREEN
========================================================= */

#final{
    z-index:500;

    background:#000;

    opacity:0;

    pointer-events:none;

    transition:
        opacity 1.5s ease;
}

#final.show{
    opacity:1;
    pointer-events:auto;
}


/* =========================================================
   HEART PORTAL
========================================================= */

.heartPortal{
    position:absolute;

    left:50%;
    top:50%;

    width:min(250px,55vw);
    height:min(230px,50vw);

    transform:
        translate(-50%,-50%)
        scale(.15);

    opacity:0;

    z-index:3;

    transition:
        transform 1.7s cubic-bezier(.2,.9,.2,1),
        opacity 1s ease;
}

#final.heartStage .heartPortal{

    opacity:1;

    transform:
        translate(-50%,-50%)
        scale(1);
}

.heartShape{

    position:absolute;

    inset:0;

    background:
        radial-gradient(
            circle at 50% 40%,
            rgba(255,100,180,.9),
            rgba(190,25,100,.65) 35%,
            rgba(70,5,50,.2) 70%,
            transparent 72%
        );

    clip-path:
        polygon(
            50% 100%,
            5% 50%,
            0% 32%,
            4% 17%,
            14% 7%,
            27% 5%,
            39% 11%,
            50% 23%,
            61% 11%,
            73% 5%,
            86% 7%,
            96% 17%,
            100% 32%,
            95% 50%
        );

    filter:
        drop-shadow(0 0 15px #ff4c9a)
        drop-shadow(0 0 45px #ff1d80)
        drop-shadow(0 0 90px #a90056);

    animation:
        heartPulse 1.4s infinite ease-in-out;
}

@keyframes heartPulse{

    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.07);
    }

}

.heartRing{

    position:absolute;

    inset:-25px;

    border:3px solid #ffd45c;

    border-radius:50%;

    opacity:.8;

    box-shadow:
        0 0 15px #ffd45c,
        0 0 50px #ff9e2c,
        inset 0 0 25px #ffb52d;

    animation:
        ringRotate 5s linear infinite,
        ringPulse 1.8s ease-in-out infinite;
}

@keyframes ringRotate{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }

}

@keyframes ringPulse{

    0%,100%{
        opacity:.45;
    }

    50%{
        opacity:1;
    }

}


/* =========================================================
   PORTAL HEARTS
========================================================= */

.portalHeart{

    position:absolute;

    color:#ff4f9a;

    font-size:25px;

    opacity:0;

    z-index:4;

    text-shadow:
        0 0 10px #ff247e,
        0 0 25px #ff247e;
}

#final.heartStage .portalHeart{
    animation:
        portalHeartFloat 3s ease-in-out forwards;
}

.portalHeart:nth-child(1){
    left:15%;
    top:25%;
    animation-delay:.3s !important;
}

.portalHeart:nth-child(2){
    left:75%;
    top:22%;
    animation-delay:.6s !important;
}

.portalHeart:nth-child(3){
    left:12%;
    top:65%;
    animation-delay:.9s !important;
}

.portalHeart:nth-child(4){
    left:80%;
    top:68%;
    animation-delay:1.1s !important;
}

.portalHeart:nth-child(5){
    left:25%;
    top:80%;
    animation-delay:1.3s !important;
}

.portalHeart:nth-child(6){
    left:70%;
    top:82%;
    animation-delay:1.5s !important;
}

@keyframes portalHeartFloat{

    0%{
        opacity:0;
        transform:
            scale(.2)
            translateY(30px);
    }

    30%{
        opacity:1;
    }

    100%{
        opacity:.9;

        transform:
            scale(1.1)
            translateY(-25px);
    }

}


/* =========================================================
   FINAL IMAGE
   IMPORTANT: BORDER FITS IMAGE PROPORTION
========================================================= */

.card{

    position:relative;

    z-index:10;

    display:block;

    visibility:visible;

    /*
       Do NOT force width and height together.
       Border will follow the actual image proportion.
    */

    width:auto;
    height:auto;

    max-width:78vw;
    max-height:76vh;

    object-fit:contain;

    border:3px solid #d4af37;

    box-shadow:
        0 0 20px #d4af37,
        0 0 80px rgba(212,175,55,.4);

    transform:scale(.08);

    opacity:0;

    filter:
        blur(18px)
        brightness(.3);

    clip-path:
        circle(12% at 50% 50%);
}

#final.imageReveal .card{

    opacity:1;

    transform:scale(1);

    filter:
        blur(0)
        brightness(1);

    clip-path:
        circle(100% at 50% 50%);

    transition:
        clip-path 2.2s cubic-bezier(.2,.8,.2,1),
        transform 2.5s cubic-bezier(.2,.8,.2,1),
        opacity 1.5s ease,
        filter 2.5s ease;
}


/* =========================================================
   SIDE FLOATING WORDS
========================================================= */

.sideWords{
    position:absolute;

    inset:0;

    z-index:25;

    pointer-events:none;
}

.floatingWord{

    position:absolute;

    display:flex;

    align-items:center;

    gap:8px;

    white-space:nowrap;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-weight:bold;

    font-size:clamp(
        15px,
        2.2vw,
        25px
    );

    opacity:0;

    text-shadow:
        0 0 8px currentColor,
        0 0 20px currentColor;

    animation:
        wordFloat 6s ease-in-out infinite;
}


/* Green heart */

.floatingWord .greenHeart{

    color:#55ff88;

    font-size:1.15em;

    text-shadow:
        0 0 8px #35ff72,
        0 0 20px #00ff55,
        0 0 35px #00ff55;

    animation:
        greenHeartPulse 1.2s ease-in-out infinite;
}

@keyframes greenHeartPulse{

    0%,100%{
        transform:scale(.9);
    }

    50%{
        transform:scale(1.25);
    }

}


/* LEFT */

.word1{

    left:3%;
    top:25%;

    color:#ff62b0;

    animation-delay:0s;
}

.word2{

    left:5%;
    top:55%;

    color:#ffd45c;

    animation-delay:1.5s;
}


/* RIGHT */

.word3{

    right:3%;
    top:32%;

    color:#72d9ff;

    animation-delay:.8s;
}

.word4{

    right:5%;
    top:63%;

    color:#c98cff;

    animation-delay:2s;
}


@keyframes wordFloat{

    0%{

        opacity:0;

        transform:
            translateY(35px)
            scale(.85);
    }

    15%{

        opacity:1;
    }

    50%{

        opacity:1;

        transform:
            translateY(-25px)
            scale(1.05);
    }

    85%{

        opacity:1;
    }

    100%{

        opacity:0;

        transform:
            translateY(-70px)
            scale(.9);
    }

}


/* =========================================================
   SIDE HEARTS
========================================================= */

.sideHeart{

    position:absolute;

    z-index:24;

    font-size:clamp(
        18px,
        3vw,
        35px
    );

    opacity:.8;

    animation:
        sideHeartFloat 5s ease-in-out infinite;

    pointer-events:none;
}

.sideHeart.h1{

    left:1%;
    top:12%;

    color:#ff4f81;

    text-shadow:
        0 0 12px #ff4f81;
}

.sideHeart.h2{

    left:10%;
    top:82%;

    color:#4dff88;

    text-shadow:
        0 0 12px #4dff88;
}

.sideHeart.h3{

    right:1%;
    top:14%;

    color:#70b7ff;

    text-shadow:
        0 0 12px #70b7ff;
}

.sideHeart.h4{

    right:10%;
    top:83%;

    color:#ffcc4d;

    text-shadow:
        0 0 12px #ffcc4d;
}

@keyframes sideHeartFloat{

    0%,100%{

        transform:
            translateY(10px)
            scale(.8);

        opacity:.5;
    }

    50%{

        transform:
            translateY(-25px)
            scale(1.25);

        opacity:1;
    }

}


/* =========================================================
   FLOATING HEARTS
========================================================= */

.finalHeart{

    position:fixed;

    bottom:-50px;

    z-index:520;

    pointer-events:none;

    animation:
        floatHeart linear forwards;
}

@keyframes floatHeart{

    0%{

        transform:
            translateY(0)
            scale(.5)
            rotate(0deg);

        opacity:0;
    }

    10%{
        opacity:1;
    }

    50%{

        transform:
            translateY(-50vh)
            scale(1)
            rotate(15deg);
    }

    100%{

        transform:
            translateY(-115vh)
            scale(.8)
            rotate(-20deg);

        opacity:0;
    }

}


/* =========================================================
   SPARKLES
========================================================= */

.sparkle{

    position:fixed;

    width:4px;
    height:4px;

    border-radius:50%;

    background:#ffe69a;

    z-index:518;

    pointer-events:none;

    box-shadow:
        0 0 8px #fff1a8,
        0 0 18px #d4af37;

    animation:
        sparkleAnim 2s ease-in-out forwards;
}

@keyframes sparkleAnim{

    0%{

        opacity:0;

        transform:scale(.2);
    }

    40%{

        opacity:1;

        transform:scale(1.5);
    }

    100%{

        opacity:0;

        transform:scale(.1);
    }

}


/* =========================================================
   CONFETTI
========================================================= */

.confetti{

    position:fixed;

    top:-20px;

    width:8px;
    height:14px;

    z-index:519;

    pointer-events:none;

    animation:
        confettiFall 4s linear forwards;
}

@keyframes confettiFall{

    0%{

        transform:
            translateY(-30px)
            rotate(0deg);

        opacity:1;
    }

    100%{

        transform:
            translateY(110vh)
            rotate(720deg);

        opacity:.9;
    }

}


/* =========================================================
   VIGNETTE
========================================================= */

.finalVignette{

    position:absolute;

    inset:0;

    pointer-events:none;

    z-index:2;

    background:
        radial-gradient(
            ellipse at center,
            transparent 35%,
            rgba(0,0,0,.7) 100%
        );
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

    .bar{
        height:22px;
    }

    .smallText{
        font-size:9px;
        letter-spacing:3px;
    }

    .giftArea{

}


/* =========================================================

@media(max-width:400px){

    }

}

</style>

</head>

<body>


<!-- =======================================================
     CINEMATIC BARS
======================================================== -->

<div class="bar top"></div>
<div class="bar bottom"></div>

<div id="stars"></div>


<!-- =======================================================
     INTRO
======================================================== -->

<section id="intro" class="screen">

    <div class="introContent">

        <div class="smallText">
            SOMETHING IS WAITING FOR YOU...
        </div>

        <div class="siha">

        </div>

<!-- =======================================================

======================================================== -->

<section

    <div class="questionBox">

        <div

        </div>

        <div

<!-- =======================================================

<section

        <div class="puzzleTitle">

<!-- =======================================================

<div id="solved">

        </h1>

<section

    <div class="curtain right"></div>

</section>


<!-- =======================================================
     FINAL SCREEN
======================================================== -->

<section
    id="final"
    class="screen">

    <div class="finalVignette"></div>


    <!-- HEART PORTAL -->

    <div
        class="heartPortal"
        id="heartPortal">

        <div class="heartRing"></div>

        <div class="heartShape"></div>

    </div>


    <!-- HEARTS AROUND HEART -->

    <div class="portalHeart">♥</div>
    <div class="portalHeart">♥</div>
    <div class="portalHeart">♥</div>
    <div class="portalHeart">♥</div>
    <div class="portalHeart">♥</div>
    <div class="portalHeart">♥</div>


    <!-- SIDE HEARTS -->

    <div class="sideHeart h1">♥</div>
    <div class="sideHeart h2">♥</div>
    <div class="sideHeart h3">♥</div>
    <div class="sideHeart h4">♥</div>


    <!-- ===================================================

    ==================================================== -->

    <div class="sideWords">

        <div class="floatingWord word1">

            <span>
                Alukuuuu
            </span>

                💚
            </span>

        </div>


        <div class="floatingWord word2">

            <span>
                Looosuuuu
            </span>

            <span class="greenHeart">
                💚
            </span>

        </div>


        <div class="floatingWord word3">

            <span>
                Gayathriiii
            </span>

            <span class="greenHeart">
                💚
            </span>

        </div>


        <div class="floatingWord word4">

            <span>
                Sihaaa
            </span>

            <span class="greenHeart">
                💚
            </span>

        </div>

    </div>


    <!-- ===================================================
         FINAL SURPRISE IMAGE
    ==================================================== -->

    <img
        src="surprise.jpeg"
        class="card"
        id="finalCard"
        alt="Birthday Surprise">

<script>

/* =========================================================
   STAR FIELD
========================================================= */

const stars =
    document.getElementById("stars");


for(let i = 0; i < 110; i++){

    const star =
        document.createElement("div");

    star.className =
        "star";

    star.style.left =
        Math.random() * 100 + "%";

    star.style.top =
        Math.random() * 100 + "%";

    star.style.animationDelay =
        Math.random() * 3 + "s";

    stars.appendChild(star);

}


/* =========================================================
   AUDIO
========================================================= */

let audioCtx = null;

let masterGain = null;

let musicStarted = false;


function startAudio(){

    if(musicStarted)
        return;

    try{

        audioCtx =
            new(
                window.AudioContext ||
                window.webkitAudioContext
            )();

        masterGain =
            audioCtx.createGain();

        masterGain.gain.value =
            0.14;

        masterGain.connect(
            audioCtx.destination
        );

        musicStarted = true;


        if(
            audioCtx.state ===
            "suspended"
        ){

            audioCtx.resume();

        }


        playMusic();

    }
    catch(e){

        console.log(
            "Audio unavailable:",
            e
        );

    }

}


/* =========================================================
   MUSIC
========================================================= */

const musicNotes = [

    196,
    246.94,
    293.66,
    392,

    329.63,
    246.94,
    220,
    293.66,

    196,
    246.94,
    329.63,
    392,

    523.25,
    392,
    329.63,
    293.66

];


function playTone(
    frequency,
    duration = .35,
    volume = .15
){

    if(
        !audioCtx ||
        !masterGain
    )
        return;


    try{

        const oscillator =
            audioCtx.createOscillator();

        const gain =
            audioCtx.createGain();


        oscillator.type =
            "sine";


        oscillator.frequency.value =
            frequency;


        gain.gain.setValueAtTime(
            0,
            audioCtx.currentTime
        );


        gain.gain.linearRampToValueAtTime(
            volume,
            audioCtx.currentTime + .04
        );


        gain.gain.exponentialRampToValueAtTime(
            .001,
            audioCtx.currentTime + duration
        );


        oscillator.connect(gain);

        gain.connect(masterGain);


        oscillator.start();


        oscillator.stop(
            audioCtx.currentTime +
            duration
        );

    }
    catch(e){}

}


function playMusic(){

    if(!audioCtx)
        return;


    let index = 0;


    function nextNote(){

        if(!musicStarted)
            return;


        playTone(
            musicNotes[index],
            .9,
            .11
        );


        index =
            (index + 1) %
            musicNotes.length;


        setTimeout(
            nextNote,
            900
        );

    }


    nextNote();

}


/* =========================================================
   SOUND EFFECTS
========================================================= */

function correctSound(){

    playTone(
        523.25,
        .15,
        .22
    );

    setTimeout(
        () => {

            playTone(
                659.25,
                .25,
                .20
            );

        },
        100
    );

}


function wrongSound(){

    playTone(
        140,
        .25,
        .18
    );

}


function puzzleSound(){

    playTone(
        330,
        .15,
        .16
    );

    setTimeout(
        () => {

            playTone(
                440,
                .2,
                .18
            );

        },
        100
    );

}


function curtainSound(){

    playTone(
        110,
        .8,
        .16
    );

    setTimeout(
        () => {

            playTone(
                164.81,
                .8,
                .14
            );

        },
        250
    );

}


function finalSound(){

    playTone(
        261.63,
        .4,
        .20
    );

    setTimeout(
        () => {

            playTone(
                329.63,
                .5,
                .18
            );

        },
        180
    );

    setTimeout(
        () => {

            playTone(
                392,
                .7,
                .20
            );

        },
        380
    );

    setTimeout(
        () => {

            playTone(
                523.25,
                1,
                .22
            );

        },
        650
    );

}


/* =========================================================
   SCREEN CONTROL
========================================================= */

function showScreen(id){

    document
        .querySelectorAll(".screen")
        .forEach(
            screen => {

                screen.classList.add(
                    "hidden"
                );

            }
        );


    const target =
        document.getElementById(id);


    if(target){

        target.classList.remove(
            "hidden"
        );

    }

}


/* =========================================================
   QUESTIONS
========================================================= */

const questions = [

    {

        question:
            "Naa unna epdi kupduven?",

        options:[
            "Alagii",
            "Alukuuuu",
            "Eruma",
            "Loosuu"
        ],

        answer:1

    },


    {

        question:
            "Enaku pidicha dress color enna?",

        options:[
            "Blue",
            "Black",
            "Orange",
            "Yellow"
        ],

        answer:3

    },


    {

        question:
            "Secret code sollu",

        options:[
            "16",
            "17",
            "18",
            "19"
        ],

        answer:2

    }

];


let currentQuestion = 0;


const questionText =
    document.getElementById(
        "questionText"
    );


const optionsContainer =
    document.getElementById(
        "options"
    );


const progress =
    document.getElementById(
        "progress"
    );


function loadQuestion(){

    const q =
        questions[
            currentQuestion
        ];


    progress.textContent =
        "QUESTION " +
        (currentQuestion + 1) +
        " / 3";


    questionText.textContent =
        q.question;


    optionsContainer.innerHTML =
        "";


    q.options.forEach(
        (optionText,index) => {

            const button =
                document.createElement(
                    "div"
                );


            button.className =
                "option";


            button.textContent =
                optionText;


            button.addEventListener(
                "click",
                () => {

                    if(
                        index ===
                        q.answer
                    ){

                        button.classList.add(
                            "correct"
                        );


                        correctSound();


                        setTimeout(
                            () => {

                                currentQuestion++;


                                if(
                                    currentQuestion <
                                    questions.length
                                ){

                                    loadQuestion();

                                }
                                else{

                                    startPuzzle();

                                }

                            },
                            650
                        );

                    }
                    else{

                        button.classList.add(
                            "wrong"
                        );


                        wrongSound();


                        setTimeout(
                            () => {

                                button.classList.remove(
                                    "wrong"
                                );

                            },
                            600
                        );

                    }

                }
            );


            optionsContainer.appendChild(
                button
            );

        }
    );

}


/* =========================================================
   ENTER
========================================================= */

document
    .getElementById("enterBtn")
    .addEventListener(
        "click",
        () => {

            startAudio();


            if(
                audioCtx &&
                audioCtx.state ===
                "suspended"
            ){

                audioCtx.resume();

            }


            currentQuestion = 0;


            showScreen(
                "questions"
            );


            loadQuestion();

        }
    );


/* =========================================================
   PUZZLE
========================================================= */

const puzzle =
    document.getElementById(
        "puzzle"
    );


let puzzleOrder = [

    0,1,2,
    3,4,5,
    6,7,8

];


function shufflePuzzle(){

    do{

        puzzleOrder =
            [...puzzleOrder]
            .sort(
                () =>
                    Math.random() - .5
            );

    }
    while(
        puzzleOrder.every(
            (value,index) =>
                value === index
        )
    );

}


function renderPuzzle(){

    puzzle.innerHTML =
        "";


    puzzleOrder.forEach(
        (pieceNumber,index) => {

            const piece =
                document.createElement(
                    "div"
                );


            piece.className =
                "piece p" +
                pieceNumber;


            piece.dataset.index =
                index;


            piece.addEventListener(
                "click",
                () => {

                    handlePieceClick(
                        index
                    );

                }
            );


            puzzle.appendChild(
                piece
            );

        }
    );

}


let selectedPiece = null;


function handlePieceClick(index){

    if(
        selectedPiece ===
        null
    ){

        selectedPiece =
            index;


        puzzle.children[
            index
        ].style.outline =
            "3px solid #d4af37";


        return;

    }


    if(
        selectedPiece ===
        index
    ){

        puzzle.children[
            index
        ].style.outline =
            "";


        selectedPiece =
            null;


        return;

    }


    const temp =
        puzzleOrder[
            selectedPiece
        ];


    puzzleOrder[
        selectedPiece
    ] =
        puzzleOrder[index];


    puzzleOrder[index] =
        temp;


    puzzleSound();


    selectedPiece =
        null;


    renderPuzzle();


    if(
        puzzleOrder.every(
            (value,index) =>
                value === index
        )
    ){

        puzzleSolved();

    }

}


function startPuzzle(){

    showScreen(
        "puzzleScreen"
    );


    shufflePuzzle();


    selectedPiece =
        null;


    renderPuzzle();

}


/* =========================================================
   SOLVED
========================================================= */

function puzzleSolved(){

    const solved =
        document.getElementById(
            "solved"
        );


    solved.classList.add(
        "show"
    );


    setTimeout(
        () => {

            solved.classList.remove(
                "show"
            );


            startCurtain();

        },
        4000
    );

}


/* =========================================================
   CURTAIN
========================================================= */

function startCurtain(){

    showScreen(
        "curtainScene"
    );


    const scene =
        document.getElementById(
            "curtainScene"
        );


    scene.classList.remove(
        "ready"
    );

    scene.classList.remove(
        "open"
    );


    const stageLight =
        scene.querySelector(
            ".stageLight"
        );


    stageLight.style.opacity =
        "0";


    setTimeout(
        () => {

            scene.classList.add(
                "ready"
            );


            curtainSound();

        },
        300
    );


    setTimeout(
        () => {

            scene.classList.add(
                "open"
            );

        },
        2200
    );


    setTimeout(
        () => {

            stageLight.style.opacity =
                "0";

        },
        5000
    );


    setTimeout(
        () => {

            showFinal();

        },
        7000
    );

}


/* =========================================================
   FINAL
========================================================= */

function showFinal(){

    const finalScreen =
        document.getElementById(
            "final"
        );


    const card =
        document.getElementById(
            "finalCard"
        );


    if(
        !finalScreen ||
        !card
    ){

        console.log(
            "Final elements missing"
        );

        return;

    }


    /*
       IMPORTANT FIX:
       remove hidden class
    */

    finalScreen.classList.remove(
        "hidden"
    );


    finalScreen.classList.remove(
        "heartStage"
    );


    finalScreen.classList.remove(
        "imageReveal"
    );


    card.style.display =
        "block";


    card.style.visibility =
        "visible";


    finalScreen.classList.add(
        "show"
    );


    /*
       HEART FIRST
    */

    setTimeout(
        () => {

            finalScreen.classList.add(
                "heartStage"
            );


            finalSound();

        },
        150
    );


    /*
       IMAGE COMES FROM HEART
    */

    setTimeout(
        () => {

            finalScreen.classList.add(
                "imageReveal"
            );

        },
        1900
    );


    /*
       CELEBRATION
    */

    setTimeout(
        () => {

            createHearts();

            createSparkles();

            createConfetti();

        },
        2500
    );

}


/* =========================================================
   COLORFUL HEARTS
========================================================= */

function createHearts(){

    const symbols = [

        "♥",
        "♡",
        "❤",
        "💗",
        "💖",
        "💜",
        "💙",
        "💚",
        "💛"

    ];


    const colors = [

        "#ff4f96",
        "#ff6b6b",
        "#ffd45c",
        "#62e7ff",
        "#a879ff",
        "#55ff88",
        "#ff8c42"

    ];


    for(
        let i = 0;
        i < 45;
        i++
    ){

        setTimeout(
            () => {

                const heart =
                    document.createElement(
                        "div"
                    );


                heart.className =
                    "finalHeart";


                heart.textContent =
                    symbols[
                        Math.floor(
                            Math.random() *
                            symbols.length
                        )
                    ];


                heart.style.left =
                    Math.random() * 100 +
                    "%";


                heart.style.fontSize =
                    (
                        14 +
                        Math.random() * 28
                    ) +
                    "px";


                heart.style.color =
                    colors[
                        Math.floor(
                            Math.random() *
                            colors.length
                        )
                    ];


                heart.style.textShadow =
                    "0 0 10px " +
                    heart.style.color;


                heart.style.animationDuration =
                    (
                        4 +
                        Math.random() * 4
                    ) +
                    "s";


                document.body.appendChild(
                    heart
                );


                setTimeout(
                    () => {

                        heart.remove();

                    },
                    8500
                );

            },
            i * 100
        );

    }

}


/* =========================================================
   SPARKLES
========================================================= */

function createSparkles(){

    for(
        let i = 0;
        i < 60;
        i++
    ){

        setTimeout(
            () => {

                const sparkle =
                    document.createElement(
                        "div"
                    );


                sparkle.className =
                    "sparkle";


                sparkle.style.left =
                    (
                        5 +
                        Math.random() * 90
                    ) +
                    "%";


                sparkle.style.top =
                    (
                        5 +
                        Math.random() * 90
                    ) +
                    "%";


                document.body.appendChild(
                    sparkle
                );


                setTimeout(
                    () => {

                        sparkle.remove();

                    },
                    2500
                );

            },
            i * 80
        );

    }

}


/* =========================================================
   CONFETTI
========================================================= */

function createConfetti(){

    const colors = [

        "#ff4f9a",
        "#ffd45c",
        "#8c6cff",
        "#62e7ff",
        "#ffffff",
        "#ff7a45",
        "#55ff88"

    ];


    for(
        let i = 0;
        i < 70;
        i++
    ){

        setTimeout(
            () => {

                const piece =
                    document.createElement(
                        "div"
                    );


                piece.className =
                    "confetti";


                piece.style.left =
                    Math.random() * 100 +
                    "%";


                piece.style.background =
                    colors[
                        Math.floor(
                            Math.random() *
                            colors.length
                        )
                    ];


                piece.style.animationDuration =
                    (
                        3 +
                        Math.random() * 3
                    ) +
                    "s";


                document.body.appendChild(
                    piece
                );


                setTimeout(
                    () => {

                        piece.remove();

                    },
                    7000
                );

            },
            i * 45
        );

    }

}

</script>
