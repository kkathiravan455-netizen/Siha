<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Surprise ✨</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    width:100%;
    height:100vh;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#050008;
    color:white;
}

.screen{
    position:fixed;
    inset:0;
    display:none;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

.screen.active{
    display:flex;
}

/* BACKGROUND */

.background{
    position:absolute;
    inset:0;
    background:
        radial-gradient(circle at 15% 20%,rgba(255,0,170,.18),transparent 28%),
        radial-gradient(circle at 85% 75%,rgba(80,0,255,.20),transparent 32%),
        linear-gradient(135deg,#050008,#180020,#050008);
}

.orb{
    position:absolute;
    width:220px;
    height:220px;
    border-radius:50%;
    background:rgba(255,0,180,.10);
    filter:blur(45px);
    animation:float 7s infinite ease-in-out;
}

.orb.one{
    top:-50px;
    left:-50px;
}

.orb.two{
    right:-50px;
    bottom:-50px;
    background:rgba(80,0,255,.12);
    animation-delay:2s;
}

@keyframes float{
    0%,100%{transform:translate(0,0)}
    50%{transform:translate(35px,-30px)}
}

/* MUSIC */

#musicBtn{
    position:fixed;
    top:18px;
    right:18px;
    width:54px;
    height:54px;
    z-index:99999;
    border:none;
    border-radius:50%;
    background:rgba(255,255,255,.12);
    color:white;
    font-size:22px;
    cursor:pointer;
    backdrop-filter:blur(12px);
    box-shadow:0 0 22px rgba(255,0,200,.55);
}

#musicBtn.on{
    background:rgba(255,0,180,.28);
    box-shadow:
        0 0 15px #ff00aa,
        0 0 35px rgba(255,0,170,.55);
}

/* INTRO */

.intro-content{
    position:relative;
    z-index:10;
    width:90%;
    max-width:520px;
    text-align:center;
}

.gift{
    position:relative;
    width:160px;
    height:140px;
    margin:0 auto 28px;
    animation:giftFloat 3s infinite ease-in-out;
}

@keyframes giftFloat{
    0%,100%{transform:translateY(0) rotateY(0)}
    50%{transform:translateY(-12px) rotateY(8deg)}
}

.gift-box{
    position:absolute;
    left:0;
    bottom:0;
    width:160px;
    height:100px;
    border-radius:12px;
    background:linear-gradient(135deg,#ff008c,#68004d);
    box-shadow:0 15px 40px rgba(255,0,150,.45);
}

.gift-box:before{
    content:"";
    position:absolute;
    left:67px;
    top:0;
    width:26px;
    height:100px;
    background:#ffd700;
}

.gift-lid{
    position:absolute;
    left:-8px;
    top:25px;
    width:176px;
    height:30px;
    border-radius:9px;
    background:linear-gradient(135deg,#ff1888,#85005d);
    z-index:2;
}

.gift-lid:before{
    content:"";
    position:absolute;
    left:75px;
    width:26px;
    height:30px;
    background:#ffd700;
}

.ribbon{
    position:absolute;
    width:48px;
    height:38px;
    top:0;
    left:45px;
    border:9px solid #ffd700;
    border-radius:50%;
    transform:rotate(-25deg);
    z-index:3;
}

.ribbon.right{
    left:68px;
    transform:rotate(25deg);
}

.title{
    font-size:clamp(40px,10vw,68px);
    font-weight:900;
    letter-spacing:2px;
    background:linear-gradient(90deg,#fff,#ff8bd6,#fff);
    -webkit-background-clip:text;
    color:transparent;
    margin-bottom:12px;
    text-shadow:0 0 30px rgba(255,0,180,.5);
}

.subtitle{
    color:#e8c7e3;
    font-size:16px;
    margin-bottom:30px;
}

.main-btn{
    border:none;
    padding:18px 30px;
    border-radius:50px;
    color:white;
    background:linear-gradient(90deg,#ff008c,#8b00ff);
    font-size:15px;
    font-weight:bold;
    letter-spacing:1px;
    cursor:pointer;
    box-shadow:
        0 0 20px rgba(255,0,180,.5),
        0 0 45px rgba(130,0,255,.25);
}

.main-btn:active{
    transform:scale(.94);
}

/* QUESTIONS */

.question-card{
    position:relative;
    z-index:10;
    width:90%;
    max-width:520px;
    padding:32px 20px;
    border-radius:26px;
    text-align:center;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.2);
    backdrop-filter:blur(18px);
    box-shadow:0 20px 70px rgba(0,0,0,.55);
}

.progress{
    color:#d8add2;
    font-size:13px;
    margin-bottom:18px;
}

.question{
    font-size:23px;
    font-weight:bold;
    margin-bottom:25px;
}

.options{
    display:grid;
    gap:12px;
}

.option{
    width:100%;
    padding:15px;
    border-radius:14px;
    border:1px solid rgba(255,255,255,.2);
    background:rgba(255,255,255,.08);
    color:white;
    font-size:16px;
    cursor:pointer;
}

.option.correct{
    background:rgba(0,255,150,.25);
    border-color:#00ff9d;
}

.option.wrong{
    background:rgba(255,0,60,.25);
    border-color:#ff315d;
}

/* PUZZLE */

.puzzle-container{
    position:relative;
    z-index:10;
    width:95%;
    text-align:center;
}

.puzzle-title{
    font-size:28px;
    margin-bottom:8px;
}

.puzzle-sub{
    color:#d8b6d3;
    font-size:14px;
    margin-bottom:20px;
}

.puzzle{
    width:min(90vw,360px);
    aspect-ratio:1;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:3px;
    padding:4px;
    background:rgba(255,255,255,.15);
    border-radius:14px;
    box-shadow:0 0 35px rgba(255,0,190,.3);
}

.piece{
    background-image:url("photo.jpeg");
    background-size:300% 300%;
    border-radius:5px;
    cursor:pointer;
    transition:.25s;
}

.piece.selected{
    outline:3px solid #ff4fbd;
    transform:scale(.94);
}

/* SUCCESS */

.success-overlay{
    position:fixed;
    inset:0;
    z-index:7000;
    display:none;
    justify-content:center;
    align-items:center;
    background:rgba(5,0,15,.82);
    backdrop-filter:blur(10px);
}

.success-overlay.show{
    display:flex;
}

.success-text{
    text-align:center;
    animation:successPop .6s ease;
}

.success-text h1{
    font-size:clamp(38px,10vw,70px);
    text-shadow:
        0 0 20px #ff00aa,
        0 0 50px #ff00aa;
}

.success-text p{
    margin-top:12px;
    color:#ffd9f3;
}

@keyframes successPop{
    from{transform:scale(.4);opacity:0}
    to{transform:scale(1);opacity:1}
}

/* CURTAIN */

#curtainScene{
    position:fixed;
    inset:0;
    z-index:8000;
    display:none;
    background:#030003;
    overflow:hidden;
    perspective:1200px;
}

#curtainScene.show{
    display:block;
}

.stage-light{
    position:absolute;
    inset:0;
    background:
        radial-gradient(
            ellipse at center 45% 50%,
            rgba(255,220,100,.20),
            rgba(0,0,0,.9) 65%
        );
}

.curtain{
    position:absolute;
    top:-5%;
    width:54%;
    height:110%;
    background:
        repeating-linear-gradient(
            90deg,
            #250005 0px,
            #780012 18px,
            #420008 32px,
            #8c0017 48px,
            #250005 65px
        );
    box-shadow:
        inset 0 0 90px rgba(0,0,0,.75),
        0 0 35px rgba(0,0,0,.8);
    transition:transform 2.5s cubic-bezier(.65,0,.15,1);
}

.curtain.left{
    left:-2%;
    transform-origin:left center;
}

.curtain.right{
    right:-2%;
    transform-origin:right center;
}

#curtainScene.open .curtain.left{
    transform:translateX(-105%) rotateY(18deg);
}

#curtainScene.open .curtain.right{
    transform:translateX(105%) rotateY(-18deg);
}

.curtain-glow{
    position:absolute;
    left:50%;
    top:0;
    transform:translateX(-50%);
    width:5px;
    height:100%;
    background:#ffd75a;
    box-shadow:
        0 0 15px #ffd75a,
        0 0 40px rgba(255,210,50,.8);
    opacity:.8;
    transition:opacity 1s;
}

#curtainScene.open .curtain-glow{
    opacity:0;
}

/* FINAL */

.final-content{
    position:relative;
    z-index:10;
    width:92%;
    max-width:700px;
    text-align:center;
}

.final-image{
    width:100%;
    max-height:82vh;
    object-fit:contain;
    border-radius:18px;
    box-shadow:
        0 0 35px rgba(255,0,180,.45),
        0 20px 60px rgba(0,0,0,.7);
    animation:finalZoom 7s ease-out;
}

@keyframes finalZoom{
    from{transform:scale(1.06);opacity:.7}
    to{transform:scale(1);opacity:1}
}

/* FLASH */

.flash{
    position:fixed;
    inset:0;
    z-index:10000;
    background:white;
    opacity:0;
    pointer-events:none;
}

.flash.active{
    animation:flash .7s ease;
}

@keyframes flash{
    0%{opacity:0}
    25%{opacity:.9}
    100%{opacity:0}
}

/* CONFETTI */

.confetti{
    position:fixed;
    top:-20px;
    width:8px;
    height:14px;
    z-index:8500;
    animation:fall linear forwards;
}

@keyframes fall{
    to{
        transform:translateY(110vh) rotate(720deg);
    }
}
</style>
</head>

<body>

<!-- MUSIC BUTTON -->
<button id="musicBtn" type="button">🔇</button>

<!-- INTRO -->
<section id="introScreen" class="screen active">
    <div class="background"></div>
    <div class="orb one"></div>
    <div class="orb two"></div>

    <div class="intro-content">

        <div class="gift">
            <div class="ribbon"></div>
            <div class="ribbon right"></div>
            <div class="gift-lid"></div>
            <div class="gift-box"></div>
        </div>

        <h1 class="title">Birthday Surprise</h1>

        <p class="subtitle">
            Something special is waiting for you ✨
        </p>

        <button id="enterBtn" class="main-btn" type="button">
            ENTER THE SURPRISE ✨
        </button>

    </div>
</section>

<!-- QUESTIONS -->
<section id="questionScreen" class="screen">

    <div class="background"></div>
    <div class="orb one"></div>
    <div class="orb two"></div>

    <div class="question-card">

        <div id="progress" class="progress">
            Question 1 of 3
        </div>

        <div id="question" class="question"></div>

        <div id="options" class="options"></div>

    </div>
</section>

<!-- PUZZLE -->
<section id="puzzleScreen" class="screen">

    <div class="background"></div>
    <div class="orb one"></div>
    <div class="orb two"></div>

    <div class="puzzle-container">

        <h1 class="puzzle-title">
            One Last Challenge 🧩
        </h1>

        <p class="puzzle-sub">
            Swipe the pieces into the correct place
        </p>

        <div id="puzzle" class="puzzle"></div>

    </div>
</section>

<!-- SUCCESS -->
<div id="successOverlay" class="success-overlay">
    <div class="success-text">
        <h1>✨ YOU DID IT ✨</h1>
        <p>Something beautiful is waiting...</p>
    </div>
</div>

<!-- CURTAIN -->
<div id="curtainScene">

    <div class="stage-light"></div>

    <div class="curtain left"></div>
    <div class="curtain right"></div>

    <div class="curtain-glow"></div>

</div>

<!-- FINAL -->
<section id="finalScreen" class="screen">

    <div class="background"></div>

    <div class="final-content">

        <img
            src="surprise.jpeg"
            class="final-image"
            alt="Birthday Surprise"
        >

    </div>
</section>

<div id="flash" class="flash"></div>

<script>
/* =====================================================
   EVERYTHING STARTS AFTER PAGE LOAD
===================================================== */

window.addEventListener("DOMContentLoaded",function(){

    /* AUDIO */

    let audioContext = null;
    let masterGain = null;
    let musicPlaying = false;
    let musicTimer = null;
    let melodyIndex = 0;

    const melody = [
        261.63,
        329.63,
        392.00,
        523.25,
        392.00,
        329.63,
        293.66,
        392.00
    ];

    function initAudio(){

        try{

            if(!audioContext){

                const AC =
                    window.AudioContext ||
                    window.webkitAudioContext;

                if(!AC){
                    return false;
                }

                audioContext = new AC();

                masterGain =
                    audioContext.createGain();

                masterGain.gain.value = 0.18;

                masterGain.connect(
                    audioContext.destination
                );
            }

            if(audioContext.state === "suspended"){
                audioContext.resume();
            }

            return true;

        }catch(error){

            console.log("Audio error",error);
            return false;

        }
    }

    function playTone(freq,duration,type,volume){

        if(!initAudio()){
            return;
        }

        try{

            const oscillator =
                audioContext.createOscillator();

            const gain =
                audioContext.createGain();

            oscillator.type =
                type || "sine";

            oscillator.frequency.setValueAtTime(
                freq,
                audioContext.currentTime
            );

            gain.gain.setValueAtTime(
                volume || .10,
                audioContext.currentTime
            );

            gain.gain.exponentialRampToValueAtTime(
                .001,
                audioContext.currentTime + duration
            );

            oscillator.connect(gain);
            gain.connect(masterGain);

            oscillator.start();

            oscillator.stop(
                audioContext.currentTime + duration
            );

        }catch(error){
            console.log(error);
        }
    }

    function buttonSound(){

        playTone(520,.12,"sine",.14);

        setTimeout(function(){
            playTone(760,.16,"sine",.13);
        },80);
    }

    function correctSound(){

        playTone(523,.18,"sine",.14);

        setTimeout(function(){
            playTone(659,.18,"sine",.14);
        },100);

        setTimeout(function(){
            playTone(784,.40,"sine",.16);
        },200);
    }

    function wrongSound(){

        playTone(180,.25,"sawtooth",.08);
    }

    function musicLoop(){

        if(!musicPlaying){
            return;
        }

        playTone(
            melody[melodyIndex],
            .72,
            "sine",
            .065
        );

        melodyIndex++;

        if(melodyIndex >= melody.length){
            melodyIndex = 0;
        }

        musicTimer =
            setTimeout(
                musicLoop,
                620
            );
    }

    function startMusic(){

        if(!initAudio()){
            return;
        }

        if(musicPlaying){
            return;
        }

        musicPlaying = true;

        melodyIndex = 0;

        document
            .getElementById("musicBtn")
            .innerText = "🎵";

        document
            .getElementById("musicBtn")
            .classList.add("on");

        musicLoop();
    }

    function stopMusic(){

        musicPlaying = false;

        clearTimeout(musicTimer);

        document
            .getElementById("musicBtn")
            .innerText = "🔇";

        document
            .getElementById("musicBtn")
            .classList.remove("on");
    }

    /* SCREEN */

    function showScreen(id){

        document
            .querySelectorAll(".screen")
            .forEach(function(screen){

                screen.classList.remove("active");

            });

        const target =
            document.getElementById(id);

        if(target){
            target.classList.add("active");
        }
    }

    /* ENTER BUTTON */

    document
        .getElementById("enterBtn")
        .addEventListener("click",function(){

            /*
              IMPORTANT:
              Audio starts DIRECTLY from
              the user's click.
            */

            initAudio();

            buttonSound();

            startMusic();

            currentQuestion = 0;

            showScreen("questionScreen");

            loadQuestion();

        });

    /* MUSIC BUTTON */

    document
        .getElementById("musicBtn")
        .addEventListener("click",function(){

            initAudio();

            if(musicPlaying){

                stopMusic();

            }else{

                startMusic();

            }

        });

    /* QUESTIONS */

    const questions = [

        {
            question:"Naa unna epdi kupduven?",
            options:[
                "Alagii",
                "Alukuuuu",
                "Eruma",
                "Loosuu"
            ],
            correct:1
        },

        {
            question:"Enaku pidicha dress color enna?",
            options:[
                "Blue",
                "Black",
                "Orange",
                "Yellow"
            ],
            correct:3
        },

        {
            question:"Secret code sollu",
            options:[
                "16",
                "17",
                "18",
                "19"
            ],
            correct:2
        }

    ];

    let currentQuestion = 0;

    function loadQuestion(){

        const q =
            questions[currentQuestion];

        document
            .getElementById("progress")
            .innerText =
            "Question " +
            (currentQuestion + 1) +
            " of 3";

        document
            .getElementById("question")
            .innerText =
            q.question;

        const options =
            document.getElementById("options");

        options.innerHTML = "";

        q.options.forEach(function(option,index){

            const button =
                document.createElement("button");

            button.className = "option";

            button.type = "button";

            button.innerText = option;

            button.addEventListener(
                "click",
                function(){

                    checkAnswer(
                        index,
                        button
                    );

                }
            );

            options.appendChild(button);

        });
    }

    function checkAnswer(selected,button){

        const q =
            questions[currentQuestion];

        if(selected === q.correct){

            button.classList.add("correct");

            correctSound();

            setTimeout(function(){

                currentQuestion++;

                if(
                    currentQuestion <
                    questions.length
                ){

                    loadQuestion();

                }else{

                    showPuzzle();

                }

            },600);

        }else{

            button.classList.add("wrong");

            wrongSound();

            setTimeout(function(){

                button.classList.remove("wrong");

            },450);

        }
    }

    /* PUZZLE */

    let selectedPiece = null;

    function showPuzzle(){

        showScreen("puzzleScreen");

        createPuzzle();
    }

    function createPuzzle(){

        const puzzle =
            document.getElementById("puzzle");

        puzzle.innerHTML = "";

        let pieces = [
            0,1,2,
            3,4,5,
            6,7,8
        ];

        do{

            pieces.sort(function(){
                return Math.random()-.5;
            });

        }while(
            pieces.every(function(value,index){
                return value === index;
            })
        );

        pieces.forEach(function(piece){

            const div =
                document.createElement("div");

            div.className = "piece";

            div.dataset.piece = piece;

            updatePiece(div);

            div.addEventListener(
                "click",
                function(){

                    selectPiece(div);

                }
            );

            puzzle.appendChild(div);

        });
    }

    function updatePiece(piece){

        const value =
            parseInt(piece.dataset.piece);

        const row =
            Math.floor(value/3);

        const col =
            value%3;

        piece.style.backgroundPosition =
            (col*50) +
            "% " +
            (row*50) +
            "%";
    }

    function selectPiece(piece){

        if(selectedPiece === null){

            selectedPiece = piece;

            piece.classList.add("selected");

            playTone(
                600,
                .08,
                "sine",
                .07
            );

            return;
        }

        if(selectedPiece === piece){

            piece.classList.remove("selected");

            selectedPiece = null;

            return;
        }

        const first = selectedPiece;
        const second = piece;

        const temp =
            first.dataset.piece;

        first.dataset.piece =
            second.dataset.piece;

        second.dataset.piece =
            temp;

        updatePiece(first);
        updatePiece(second);

        first.classList.remove("selected");

        selectedPiece = null;

        playTone(
            720,
            .10,
            "sine",
            .08
        );

        checkPuzzle();
    }

    function checkPuzzle(){

        const pieces =
            document.querySelectorAll(".piece");

        let solved = true;

        pieces.forEach(function(piece,index){

            if(
                parseInt(piece.dataset.piece)
                !== index
            ){

                solved = false;

            }

        });

        if(solved){

            puzzleCompleted();

        }
    }

    function puzzleCompleted(){

        correctSound();

        const overlay =
            document.getElementById(
                "successOverlay"
            );

        overlay.classList.add("show");

        setTimeout(function(){

            overlay.classList.remove("show");

            startCurtain();

        },1800);
    }

    /* CURTAIN SOUND */

    function curtainSound(){

        if(!initAudio()){
            return;
        }

        try{

            const oscillator =
                audioContext.createOscillator();

            const gain =
                audioContext.createGain();

            oscillator.type = "sine";

            oscillator.frequency.setValueAtTime(
                100,
                audioContext.currentTime
            );

            oscillator.frequency.exponentialRampToValueAtTime(
                700,
                audioContext.currentTime + 2.5
            );

            gain.gain.setValueAtTime(
                .001,
                audioContext.currentTime
            );

            gain.gain.linearRampToValueAtTime(
                .18,
                audioContext.currentTime + .5
            );

            gain.gain.exponentialRampToValueAtTime(
                .001,
                audioContext.currentTime + 2.5
            );

            oscillator.connect(gain);
            gain.connect(masterGain);

            oscillator.start();

            oscillator.stop(
                audioContext.currentTime + 2.5
            );

        }catch(error){
            console.log(error);
        }
    }

    /* CURTAIN */

    function startCurtain(){

        const curtain =
            document.getElementById(
                "curtainScene"
            );

        curtain.classList.add("show");

        setTimeout(function(){

            curtainSound();

            curtain.classList.add("open");

            setTimeout(function(){

                flashScreen();

            },1900);

            setTimeout(function(){

                curtain.classList.remove("show");

                curtain.classList.remove("open");

                showScreen("finalScreen");

                createConfetti();

                finalRevealSound();

            },2800);

        },500);
    }

    function flashScreen(){

        const flash =
            document.getElementById("flash");

        flash.classList.remove("active");

        void flash.offsetWidth;

        flash.classList.add("active");
    }

    /* FINAL SOUND */

    function finalRevealSound(){

        playTone(523,.30,"sine",.14);

        setTimeout(function(){
            playTone(659,.30,"sine",.14);
        },180);

        setTimeout(function(){
            playTone(784,.40,"sine",.16);
        },360);

        setTimeout(function(){
            playTone(1046,.70,"sine",.15);
        },550);
    }

    /* CONFETTI */

    function createConfetti(){

        for(let i=0;i<120;i++){

            const confetti =
                document.createElement("div");

            confetti.className = "confetti";

            confetti.style.left =
                Math.random()*100 + "%";

            confetti.style.animationDuration =
                2 + Math.random()*3 + "s";

            confetti.style.animationDelay =
                Math.random()*.8 + "s";

            const colors = [
                "#ff4da6",
                "#ffd700",
                "#8b5cff",
                "#00e5ff",
                "#ffffff",
                "#ff6b35"
            ];

            confetti.style.background =
                colors[
                    Math.floor(
                        Math.random()*colors.length
                    )
                ];

            document.body.appendChild(confetti);

            setTimeout(function(){

                confetti.remove();

            },5000);
        }
    }

    /* STARS */

    for(let i=0;i<45;i++){

        const star =
            document.createElement("div");

        star.style.position = "fixed";
        star.style.width = "2px";
        star.style.height = "2px";
        star.style.borderRadius = "50%";
        star.style.background = "rgba(255,255,255,.55)";
        star.style.left =
            Math.random()*100 + "%";
        star.style.top =
            Math.random()*100 + "%";
        star.style.pointerEvents = "none";
        star.style.zIndex = "1";

        document.body.appendChild(star);
    }

});
</script>
